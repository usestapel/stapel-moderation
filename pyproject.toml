[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stapel-moderation"
version = "0.6.3"
description = "Target-generic moderation queue: reports, verdicts, sanctions and appeals for the Stapel framework"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["django", "stapel", "moderation", "trust-and-safety", "dsa"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    # Floor 0.32.0: the module stands on comm Tasks (the screening retry
    # ladder), the Projection primitive with its two modes, the staff-mandate
    # access declarations, and the cross-service user blacklist this module
    # is the first producer of.
    #
    # `stapel-agent` is deliberately NOT a dependency. The LLM is reached by
    # the string name `llm.complete` over comm, so a deployment without an
    # agent must still boot — in it, ON_SCREENING_UNAVAILABLE sends every case
    # to the human queue. The prompt-injection sanitizer is the one thing
    # imported from it, lazily and inside the default screener, because the
    # screener is a replaceable seam rather than a hard edge.
    "stapel-core>=0.43.0,<1.0",
]

[project.urls]
Homepage = "https://github.com/usestapel/stapel-moderation"
Repository = "https://github.com/usestapel/stapel-moderation"
Documentation = "https://github.com/usestapel/stapel-moderation#readme"
Changelog = "https://github.com/usestapel/stapel-moderation/blob/main/CHANGELOG.md"
Issues = "https://github.com/usestapel/stapel-moderation/issues"

[project.optional-dependencies]
all = []

[tool.setuptools]
package-dir = {"stapel_moderation" = "."}
packages = ["stapel_moderation", "stapel_moderation.migrations"]

[tool.setuptools.package-data]
# The contract documents ship IN THE WHEEL: that is what makes
# `stapel-catalog --from-installed` possible, i.e. what turns catalog
# freshness from somebody's discipline into a property of the lockfile.
# A module that keeps them repo-only publishes code an agent cannot read.
# Both stapel-docs packaging gotchas are closed here by construction:
# docs/schema.json IS listed (a wheel without it makes
# `stapel-catalog --from-installed` read off somebody's discipline instead of
# the lockfile), and the translations/ catalogues listed below are real files
# in the tree rather than a pattern matching nothing.
stapel_moderation = [
    "py.typed",
    "docs/schema.json",
    "docs/flows.json",
    "docs/errors.json",
    "docs/capabilities.json",
    "docs/llms.txt",
    "CONFIG.MD",
    "migrations/*.py",
    "schemas/**/*.json",
    "translations/*.json",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Single source for the git hooks and CI (they pass the same flags on the CLI).
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
django_find_project = false
addopts = "--tb=short -q --import-mode=importlib"

[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/conftest.py",
    "*/migrations/*",
]
